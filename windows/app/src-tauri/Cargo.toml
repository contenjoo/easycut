[package]
name = "easycut-windows"
version = "0.2.0"
description = "EasyCut for Windows"
edition = "2021"
license = "MIT"

[lib]
name = "easycut_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
easycut-core = { path = "../../crates/easycut-core" }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
ureq = { version = "2", features = ["json"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
