[package]
name = "easycut-windows"
version = "0.1.0"
description = "EasyCut for Windows"
edition = "2021"
license = "MIT"

[lib]
name = "easycut_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
easycut-core = { path = "../../crates/easycut-core" }
