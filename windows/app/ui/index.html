<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyCut</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="toolbar">
    <div class="group">
      <button data-cmd="import" class="primary" data-i18n="import">가져오기</button>
      <button data-cmd="record" id="rec-btn" title="Ctrl+Alt+R">🔴 <span data-l="녹화">녹화</span></button>
      <span id="title" class="title"></span>
    </div>
    <div class="group">
      <button data-cmd="undo" data-i18n-title="undo" title="실행 취소 (Ctrl+Z)">↶</button>
      <button data-cmd="redo" data-i18n-title="redo" title="다시 실행 (Ctrl+Y)">↷</button>
      <button data-cmd="split" data-i18n="split">분할</button>
      <button data-cmd="delete" data-i18n="delete">삭제</button>
      <button data-cmd="text" data-i18n="text">텍스트</button>
      <button data-cmd="silence" data-i18n="silence">무음 컷</button>
      <button data-cmd="transcribe" data-i18n="transcribe">음성 인식</button>
      <button data-cmd="captions" data-i18n="makeCaptions">자막 생성</button>
      <button data-cmd="ai" title="Ctrl+4">✨ <span data-l="AI 편집">AI 편집</span></button>
      <button data-cmd="shortcuts" title="Ctrl+/">⌨</button>
      <button data-cmd="save" data-i18n="save">저장</button>
      <button data-cmd="export" class="primary" data-i18n="export">내보내기</button>
    </div>
  </header>

  <main id="main">
    <section id="left" class="panel">
      <nav class="tabs">
        <button data-tab="media" class="on" data-i18n="media">미디어</button>
        <button data-tab="transcript" data-i18n="transcript">대본</button>
        <button data-tab="captions" data-i18n="captionsTab">자막</button>
        <button data-tab="ai">✨ AI</button>
      </nav>
      <div id="tab-media" class="tab on"></div>
      <div id="tab-transcript" class="tab"></div>
      <div id="tab-captions" class="tab"></div>
      <div id="tab-ai" class="tab ai-tab"></div>
    </section>

    <div class="vsplit" data-split="left"></div>
    <section id="center">
      <div id="stage">
        <div id="canvas">
          <video id="video" playsinline></video>
          <img id="still" alt="" />
          <div id="overlay"></div>
        </div>
        <div id="empty-hint"><div style="font-size:34px">🎞</div><div data-i18n="dropHint">영상, 오디오, 사진을 여기로 끌어다 놓으세요</div>
          <div class="hint" data-l="또는 Ctrl+I 로 가져오기">또는 Ctrl+I 로 가져오기</div><button data-cmd="import" class="primary" data-l="미디어 가져오기…">미디어 가져오기…</button></div>
        <div id="speed-badge"></div>
      </div>
      <div id="scrub">
        <span id="clock">00:00.00</span>
        <input id="scrub-bar" type="range" min="0" max="1" step="0.001" value="0" />
        <span id="dur">00:00.00</span>
      </div>
      <div id="transport">
        <button data-cmd="start" data-l-title="처음으로 (Home)">⏮</button>
        <button data-cmd="back5" data-l-title="5초 뒤로 (Shift+←)">−5s</button>
        <button data-cmd="prevFrame" data-l-title="이전 프레임 (,)">‹</button>
        <button data-cmd="play" id="playBtn" class="primary" data-l-title="재생/일시정지 (Space)">▶</button>
        <button data-cmd="nextFrame" data-l-title="다음 프레임 (.)">›</button>
        <button data-cmd="fwd5" data-l-title="5초 앞으로 (Shift+→)">+5s</button>
        <button data-cmd="end" data-l-title="끝으로 (End)">⏭</button>
        <span class="sep"></span>
        <button id="cc-btn" data-cmd="toggleCaptions" data-l-title="미리보기 자막 표시">💬</button>
        <span id="vol-ic" data-l-title="미리보기 볼륨">🔊</span><input id="vol" type="range" min="0" max="1" step="0.01" value="1" />
        <span class="sep"></span>
        <span data-l-title="재생 속도 (최대 20배속) — [ 느리게, ] 빠르게, \ 1배속">🐇</span>
        <select id="rate" title="J / K / L · [ ] \">
          <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option><option value="6">6x</option><option value="8">8x</option><option value="10">10x</option><option value="12">12x</option><option value="16">16x</option><option value="20">20x</option>
        </select>
        <input id="rate-slider" type="range" min="-1.386" max="2.996" step="0.01" value="0" />
      </div>
    </section>

    <div class="vsplit" data-split="right"></div>
    <section id="right" class="panel"><div id="inspector"></div></section>
  </main>
  <div class="hsplit" data-split="timeline"></div>

  <section id="timeline-wrap">
    <div id="tl-toolbar">
      <button data-cmd="split" title="S / Ctrl+T">✂ <span data-l="분할">분할</span></button>
      <button data-cmd="markIn" title="I">[ I</button>
      <button data-cmd="markOut" title="O">O ]</button>
      <span id="range-info"></span>
      <span class="spacer"></span>
      <button id="snap-btn" data-cmd="toggleSnap" title="N">🧲</button>
      <button id="follow-btn" data-cmd="toggleFollow" data-l-title="재생헤드 따라가기">⇥</button>
      <button data-cmd="trackSmaller" data-l-title="트랙 높이 줄이기">⇕−</button>
      <button data-cmd="trackBigger" data-l-title="트랙 높이 늘리기">⇕+</button>
      <button data-cmd="zoomOut" title="Ctrl+-">−</button>
      <input id="zoom" type="range" min="-0.7" max="2.9" step="0.01" value="1.6" />
      <button data-cmd="zoomIn" title="Ctrl+=">＋</button>
      <button data-cmd="fit" data-i18n="fit">전체</button>
    </div>
    <div id="tl-scroll"><canvas id="timeline"></canvas></div>
  </section>

  <div id="toast"></div>
  <div id="modal" class="hidden"><div class="box" id="modal-box"></div></div>
  <div id="jobs"></div>

  <script src="strings.js"></script>
  <script src="i18n.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
