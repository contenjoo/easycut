name: Windows build

on:
  push:
    branches: [main]
    tags: ["win-v*"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 자체 검사에서 합성 음성으로 읽고 Whisper가 알아듣는지 확인하는 문장
  # ("Thank you for watching." 같은 영상 끝인사는 Whisper가 다른 말과 함께 들으면 빼 버려서 쓰지 않는다)
  SELFTEST_SPEECH_TEXT: "Hello everyone. Today we are testing the video editor on Windows. When you delete words from the transcript, the video is cut as well. The captions are made from the same words."

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Bundle ffmpeg and Whisper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bin = "windows/app/src-tauri/resources/bin"
          New-Item -ItemType Directory -Force -Path $bin, windows/app/src-tauri/resources/licenses | Out-Null
          # ffmpeg (gyan.dev essentials build: libx264, libass)
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($ff.FullName)/bin/ffmpeg.exe", "$($ff.FullName)/bin/ffprobe.exe" $bin
          Copy-Item "$($ff.FullName)/LICENSE" windows/app/src-tauri/resources/licenses/FFmpeg-LICENSE.txt
          # whisper.cpp v1.9.4 (CPU build, published on build tag b5130)
          gh release download b5130 --repo ggml-org/whisper.cpp --pattern whisper-bin-x64.zip --output whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper
          Get-ChildItem whisper -Recurse -Include whisper-cli.exe, *.dll | Copy-Item -Destination $bin
          Copy-Item vendor/licenses/whisper.cpp-MIT.txt windows/app/src-tauri/resources/licenses/
          Get-ChildItem $bin | Format-Table Name, Length

      - name: Core tests
        working-directory: windows
        run: cargo test -p easycut-core

      - name: Build installer
        working-directory: windows/app
        run: |
          npm ci
          npx tauri build

      # 앱이 쓰는 것과 같은 Whisper 모델 (574MB) — 한 번 받아 캐시
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\com.contenjoo.easycut.windows\models
          key: whisper-ggml-large-v3-turbo-q5_0

      - name: Download Whisper model
        run: |
          $dir = "$env:APPDATA\com.contenjoo.easycut.windows\models"
          $model = "$dir\ggml-large-v3-turbo-q5_0.bin"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if (-not (Test-Path $model) -or (Get-Item $model).Length -lt 100MB) {
            curl.exe -L --fail -s -o $model https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-Item $model | Format-Table Name, Length

      - name: Make test speech
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.GetInstalledVoices() | ForEach-Object { $_.VoiceInfo.Name }
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav")
          $s.Speak($env:SELFTEST_SPEECH_TEXT)
          $s.Dispose()
          Get-Item "$env:RUNNER_TEMP\speech.wav" | Format-Table Name, Length

      - name: Self-test on Windows
        run: |
          $env:PATH = "$PWD\windows\app\src-tauri\resources\bin;$env:PATH"
          # 실제 음성으로 Whisper 인식 → 대본 컷까지 검사
          $env:EASYCUT_SELFTEST_SPEECH = "$env:RUNNER_TEMP\speech.wav"
          $env:EASYCUT_SELFTEST_SPEECH_TEXT = $env:SELFTEST_SPEECH_TEXT
          # 창 앱(GUI subsystem)이라 끝날 때까지 기다려 종료 코드를 확인한다
          $p = Start-Process windows/target/release/easycut-windows.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest" -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path selftest.txt -Pattern "ALL PASSED" -Quiet)) { exit 1 }

      # 자체 검사가 실패하면 원인 확인용으로 테스트 음성과 결과를 남긴다
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: selftest-debug
          path: |
            ${{ runner.temp }}\speech.wav
            selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EasyCut-Windows-setup
          path: windows/target/release/bundle/nsis/*.exe

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem windows/target/release/bundle/nsis/*.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $exe.FullName --prerelease --title "EasyCut for Windows $($env:GITHUB_REF_NAME.Substring(5))" --notes-file windows/RELEASE_NOTES.txt
