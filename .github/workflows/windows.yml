name: Windows build

on:
  push:
    branches: [main]
    tags: ["win-v*"]
    paths: ["windows/**", ".github/workflows/windows.yml", ".github/workflows/test-broadcast-webview.ps1"]
  workflow_dispatch:
    inputs:
      publishRelease:
        description: Publish the tested Windows installer as a stable release
        type: boolean
        default: false
      privateLiveTest:
        description: Verify a separately authorized single-use private YouTube destination with synthetic devices
        type: boolean
        default: false
      broadcastInstallerRunId:
        description: Verify the exact installer from a previous Windows build in the broadcast studio
        type: string
        default: ""
      generationOnly:
        description: Run focused video creation checks with a debug app or supplied installer
        type: boolean
        default: false
      installerRunId:
        description: Validate a previous run's exact Windows installer (forces generation-only mode)
        type: string
        default: ""

permissions:
  contents: write
  actions: read

env:
  # 자체 검사에서 합성 음성으로 읽고 Whisper가 알아듣는지 확인하는 문장
  # ("Thank you for watching." 같은 영상 끝인사는 Whisper가 다른 말과 함께 들으면 빼 버려서 쓰지 않는다)
  SELFTEST_SPEECH_TEXT: "Hello everyone. Today we are testing the video editor on Windows. When you delete words from the transcript, the video is cut as well. The captions are made from the same words."

jobs:
  generation:
    if: github.event_name == 'workflow_dispatch' && inputs.broadcastInstallerRunId == '' && (inputs.generationOnly || inputs.installerRunId != '')
    uses: ./.github/workflows/windows-generation.yml
    with:
      installerRunId: ${{ inputs.installerRunId }}
  broadcast-installer:
    if: github.event_name == 'workflow_dispatch' && inputs.broadcastInstallerRunId != ''
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and install the exact Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN_ID: ${{ inputs.broadcastInstallerRunId }}
        run: |
          $runId = $env:INSTALLER_RUN_ID
          if ($runId -notmatch '^[0-9]+$') { throw "Expected a numeric Windows build run ID" }
          $api = "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId"
          $run = gh api $api | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.path -ne ".github/workflows/windows.yml" -or $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY) { throw "Expected a Windows build from this repository" }
          $baseline = $run.head_sha
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw "Missing installer source commit" }
          git fetch --no-tags --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch installer source" }
          git diff --quiet $baseline HEAD -- "windows/app/ui" "windows/app/src-tauri" "windows/crates" "windows/Cargo*" "windows/app/package*" ":(exclude)windows/**/tests/**"
          if ($LASTEXITCODE -ne 0) { throw "The selected installer and the checked-out Windows product code differ" }

          $response = gh api "$api/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read installer artifacts" }
          $artifacts = @($response.artifacts | Where-Object { $_.name -eq "EasyCut-Windows-setup" -and -not $_.expired })
          if ($artifacts.Count -ne 1) { throw "Expected one unexpired EasyCut-Windows-setup artifact" }
          $artifact = $artifacts[0]
          $zip = "$env:RUNNER_TEMP/broadcast-setup.zip"
          Invoke-WebRequest $artifact.archive_download_url -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json"} -OutFile $zip
          $archiveHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($artifact.digest -ne "sha256:$archiveHash") { throw "Installer archive failed the GitHub SHA-256 check" }
          $download = "$env:RUNNER_TEMP/broadcast-installer"
          Expand-Archive -LiteralPath $zip -DestinationPath $download
          $setups = @(Get-ChildItem $download -Filter "*setup.exe" -Recurse -File)
          if ($setups.Count -ne 1) { throw "Expected one NSIS installer" }
          $hash = (Get-FileHash $setups[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $install = Start-Process $setups[0].FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed with exit $($install.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "EasyCut"
          $exe = Join-Path $dir "easycut-windows.exe"
          foreach ($path in @($exe, "$dir/resources/bin/ffmpeg.exe", "$dir/resources/bin/ffprobe.exe")) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing installed file: $path" }
          }
          $proof = @{sourceRunId=$runId; sourceHeadSha=$baseline; verificationHeadSha=$env:GITHUB_SHA; artifactId=$artifact.id; archiveSha256=$archiveHash; installerSha256=$hash; installerBytes=$setups[0].Length; installedExecutableSha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()}
          $output = "$env:RUNNER_TEMP/native-evidence"
          New-Item -ItemType Directory -Force $output | Out-Null
          $proof | ConvertTo-Json | Set-Content "$output/installer-verification.json"
          Write-Host "Exact NSIS installer SHA256: $hash"
      - name: Check local synthetic broadcast on the installed app
        run: |
          npm install --prefix "$env:RUNNER_TEMP/easycut-ui-tests" --no-save playwright-core
          if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed" }
          ./.github/workflows/test-broadcast-webview.ps1 -Executable "$env:LOCALAPPDATA/EasyCut/easycut-windows.exe" -Mode local
      - name: Check the authorized private YouTube event on the installed app
        if: inputs.privateLiveTest
        env:
          EASYCUT_PRIVATE_LIVE_TEST_KEY: ${{ secrets.EASYCUT_PRIVATE_LIVE_TEST_KEY }}
        run: |
          ./.github/workflows/test-broadcast-webview.ps1 -Executable "$env:LOCALAPPDATA/EasyCut/easycut-windows.exe" -Mode private
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broadcast-installed-evidence
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: ignore

  build:
    if: github.event_name != 'workflow_dispatch' || (!inputs.generationOnly && inputs.installerRunId == '' && inputs.broadcastInstallerRunId == '')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          cache-on-failure: true

      - name: Bundle ffmpeg and Whisper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bin = "windows/app/src-tauri/resources/bin"
          New-Item -ItemType Directory -Force -Path $bin, windows/app/src-tauri/resources/licenses | Out-Null
          # ffmpeg (gyan.dev essentials build: libx264, libass)
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($ff.FullName)/bin/ffmpeg.exe", "$($ff.FullName)/bin/ffprobe.exe" $bin
          Copy-Item "$($ff.FullName)/LICENSE" windows/app/src-tauri/resources/licenses/FFmpeg-LICENSE.txt
          # whisper.cpp v1.9.4 (CPU build, published on build tag b5130)
          gh release download b5130 --repo ggml-org/whisper.cpp --pattern whisper-bin-x64.zip --output whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper
          Get-ChildItem whisper -Recurse -Include whisper-cli.exe, *.dll | Copy-Item -Destination $bin
          Copy-Item vendor/licenses/whisper.cpp-MIT.txt windows/app/src-tauri/resources/licenses/
          Get-ChildItem $bin | Format-Table Name, Length

      - name: Core tests
        working-directory: windows
        run: |
          $env:PATH = "$PWD\app\src-tauri\resources\bin;$env:PATH"
          $env:EASYCUT_EFFECT_FFMPEG = "$PWD\app\src-tauri\resources\bin\ffmpeg.exe"
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test -p easycut-windows --lib studio::tests:: -- --include-ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --test app/tests/effects-preview.test.mjs app/tests/effect-controls.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node app/tests/natural-edit.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --test app/tests/generation-worker.test.cjs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Real Canvas and Remotion previews and rendering
        run: |
          $env:PATH = "$PWD\windows\app\src-tauri\resources\bin;$env:PATH"
          $env:EASYCUT_GENERATION_EVIDENCE = "$env:RUNNER_TEMP/generation-evidence"
          node windows/app/tests/generation-integration.cjs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installer
        env:
          EASYCUT_YOUTUBE_CLIENT_ID: ${{ secrets.EASYCUT_YOUTUBE_CLIENT_ID }}
          EASYCUT_YOUTUBE_CLIENT_SECRET: ${{ secrets.EASYCUT_YOUTUBE_CLIENT_SECRET }}
        working-directory: windows/app
        run: |
          if (-not $env:EASYCUT_YOUTUBE_CLIENT_ID -or -not $env:EASYCUT_YOUTUBE_CLIENT_SECRET) { throw "Configure the EasyCut desktop OAuth client before packaging." }
          npm ci
          npx tauri build

      # 앱이 쓰는 것과 같은 Whisper 모델 (574MB) — 한 번 받아 캐시
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\com.contenjoo.easycut.windows\models
          key: whisper-ggml-large-v3-turbo-q5_0

      - name: Download Whisper model
        run: |
          $dir = "$env:APPDATA\com.contenjoo.easycut.windows\models"
          $model = "$dir\ggml-large-v3-turbo-q5_0.bin"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if (-not (Test-Path $model) -or (Get-Item $model).Length -lt 100MB) {
            curl.exe -L --fail -s -o $model https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-Item $model | Format-Table Name, Length

      - name: Make test speech
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.GetInstalledVoices() | ForEach-Object { $_.VoiceInfo.Name }
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav")
          $s.Speak($env:SELFTEST_SPEECH_TEXT)
          $s.Dispose()
          Get-Item "$env:RUNNER_TEMP\speech.wav" | Format-Table Name, Length

      - name: Self-test on Windows
        run: |
          $env:PATH = "$PWD\windows\app\src-tauri\resources\bin;$env:PATH"
          # 실제 음성으로 Whisper 인식 → 대본 컷까지 검사
          $env:EASYCUT_SELFTEST_SPEECH = "$env:RUNNER_TEMP\speech.wav"
          $env:EASYCUT_SELFTEST_SPEECH_TEXT = $env:SELFTEST_SPEECH_TEXT
          # 창 앱(GUI subsystem)이라 끝날 때까지 기다려 종료 코드를 확인한다
          $p = Start-Process windows/target/release/easycut-windows.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest" -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path selftest.txt -Pattern "ALL PASSED" -Quiet)) { exit 1 }

      # 자체 검사가 실패하면 원인 확인용으로 테스트 음성과 결과를 남긴다
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: selftest-debug
          path: |
            ${{ runner.temp }}\speech.wav
            selftest.txt

      - name: MCP bridge on Windows (EasyCut.exe --mcp → running app)
        run: |
          $exe = Resolve-Path windows/target/release/easycut-windows.exe
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 12
          $lines = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"add_text","arguments":{"text":"CI","start":0}}}',
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"get_project_state","arguments":{}}}'
          )
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\mcp-in.txt", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $p = Start-Process $exe -ArgumentList "--mcp" -Wait -PassThru -NoNewWindow -RedirectStandardInput "$env:RUNNER_TEMP\mcp-in.txt" -RedirectStandardOutput "$env:RUNNER_TEMP\mcp-out.txt"
          $out = Get-Content "$env:RUNNER_TEMP\mcp-out.txt" -Encoding UTF8
          $out | ForEach-Object { $_.Substring(0, [Math]::Min(200, $_.Length)) }
          Stop-Process -Id $app.Id -Force
          $tools = ($out[1] | ConvertFrom-Json).result.tools.Count
          if ($tools -ne 37) { Write-Error "expected 37 tools, got $tools"; exit 1 }
          if (-not ($out[3] -match '"isError":false') -or -not ($out[3] -match 'CI')) { Write-Error "tool call through the running app failed"; exit 1 }

      - name: Silent install (what auto-update runs) and self-test of the installed app
        run: |
          $setup = Get-ChildItem windows/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $programs = [Environment]::GetFolderPath("Programs")
          $shellLink = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $programs "OK Cut.lnk"))
          $shellLink.TargetPath = Join-Path $env:LOCALAPPDATA "EasyCut/easycut-windows.exe"
          $shellLink.Save()
          $p = Start-Process $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit code $($p.ExitCode)"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA "EasyCut"
          Get-ChildItem $dir -Recurse -Depth 2 | Select-Object FullName, Length | Format-Table -AutoSize
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          if (-not $exe) { Write-Error "installed app not found in $dir"; exit 1 }
          foreach ($name in @("worker.cjs","canvas-render.cjs","package.json","skills.json","VideoSkillNotices.txt")) {
            if (-not (Test-Path (Join-Path $dir "resources/generation/$name"))) { Write-Error "Missing installed video creation resource: $name"; exit 1 }
          }
          $t = Start-Process $exe.FullName -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest2" -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest2.txt
          Get-Content selftest2.txt | Select-Object -First 6
          if ($t.ExitCode -ne 0 -or -not (Select-String -Path selftest2.txt -Pattern "ALL PASSED" -Quiet)) { exit 1 }
          $programs = [Environment]::GetFolderPath("Programs")
          if (-not (Test-Path (Join-Path $programs "EasyCut.lnk"))) { throw "EasyCut Start menu shortcut is missing" }
          if (Test-Path (Join-Path $programs "OK Cut.lnk")) { throw "Legacy shortcut was not migrated" }
          $shown = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\EasyCut").DisplayName
          if ($shown -ne "EasyCut") { throw "Unexpected Apps & features name: $shown" }
          $testedHash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          "TESTED_INSTALLER_SHA256=$testedHash" >> $env:GITHUB_ENV
          Write-Host "Tested installer SHA256: $testedHash"

      - uses: actions/upload-artifact@v4
        with:
          name: EasyCut-Windows-setup
          path: windows/target/release/bundle/nsis/*.exe

      # UI instrumentation is a separate build; the installer above keeps devtools disabled.
      - name: Native WebView2 recording and natural edit UI
        env:
          EASYCUT_YOUTUBE_CLIENT_ID: ${{ secrets.EASYCUT_YOUTUBE_CLIENT_ID }}
          EASYCUT_YOUTUBE_CLIENT_SECRET: ${{ secrets.EASYCUT_YOUTUBE_CLIENT_SECRET }}
        timeout-minutes: 15
        run: |
          $testConfig = Get-Content windows/app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $testConfig.app.windows[0] | Add-Member -NotePropertyName devtools -NotePropertyValue $true
          $configPath = "$env:RUNNER_TEMP/native-tauri.conf.json"
          $testConfig | ConvertTo-Json -Depth 100 | Set-Content $configPath
          Push-Location windows/app
          try {
            npx tauri build --no-bundle --features tauri/devtools --config $configPath
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally { Pop-Location }
          # --no-bundle can leave the executable without its resources when the build is cached.
          # Run the instrumented app with the exact resources from the installer tested above.
          $installedResources = Join-Path $env:LOCALAPPDATA "EasyCut/resources"
          $testResources = Join-Path (Resolve-Path "windows/target/release").Path "resources"
          foreach ($tool in @("ffmpeg.exe", "ffprobe.exe", "whisper-cli.exe")) {
            $relativePath = "bin/$tool"
            Write-Host "Instrumented build has $tool before staging: $(Test-Path (Join-Path $testResources $relativePath))"
            if (-not (Test-Path (Join-Path $installedResources $relativePath) -PathType Leaf)) {
              throw "Missing tool in installed application: $tool"
            }
          }
          New-Item -ItemType Directory -Force $testResources | Out-Null
          Copy-Item -Path "$installedResources/*" -Destination $testResources -Recurse -Force
          npm install --prefix "$env:RUNNER_TEMP/easycut-ui-tests" --no-save playwright-core
          if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed" }
          $env:EASYCUT_NATIVE_SPEECH = "$env:RUNNER_TEMP/speech.wav"
          $env:EASYCUT_GENERATION_MANIFEST = "$env:RUNNER_TEMP/generation-evidence/generation-manifest.json"
          $env:EASYCUT_CHROME = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source
          if (-not $env:EASYCUT_CHROME) { $env:EASYCUT_CHROME = "$env:ProgramFiles/Google/Chrome/Application/chrome.exe" }
          ./.github/workflows/test-broadcast-webview.ps1 -Executable "windows/target/release/easycut-windows.exe" -Mode suite

      - name: Send synthetic scenes to the authorized private YouTube event
        if: github.event_name == 'workflow_dispatch' && inputs.privateLiveTest
        timeout-minutes: 6
        env:
          EASYCUT_PRIVATE_LIVE_TEST_KEY: ${{ secrets.EASYCUT_PRIVATE_LIVE_TEST_KEY }}
        run: |
          ./.github/workflows/test-broadcast-webview.ps1 -Executable "$env:LOCALAPPDATA/EasyCut/easycut-windows.exe" -Mode private

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural-edit-native-evidence
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-generation-evidence
          path: |
            ${{ runner.temp }}/generation-evidence/generation-manifest.json
            ${{ runner.temp }}/generation-evidence/*/preview-*.png
            ${{ runner.temp }}/generation-evidence/*/render.mp4
          if-no-files-found: ignore

      # 정식 릴리스로 올리되 "최신"은 맥 버전에 남긴다 (맥 자동 업데이트가 releases/latest를 본다)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/win-v') || (github.event_name == 'workflow_dispatch' && inputs.publishRelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem windows/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $version = (Get-Content windows/app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "win-v$version"
          if ($env:GITHUB_REF -like "refs/tags/*" -and $env:GITHUB_REF_NAME -ne $tag) { throw "Release tag and app version differ" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          if ($hash -ne $env:TESTED_INSTALLER_SHA256) { throw "Release installer differs from the tested installer" }
          Write-Host "Release installer SHA256: $hash"
          $asset = Join-Path $env:RUNNER_TEMP "EasyCut_${version}_x64-setup.exe"
          Copy-Item $exe.FullName $asset
          gh release create $tag $asset --target $env:GITHUB_SHA --latest=false --title "EasyCut for Windows $version" --notes-file windows/RELEASE_NOTES.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
