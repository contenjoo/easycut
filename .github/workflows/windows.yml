name: Windows build

on:
  push:
    branches: [main]
    tags: ["win-v*"]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Bundle ffmpeg and Whisper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bin = "windows/app/src-tauri/resources/bin"
          New-Item -ItemType Directory -Force -Path $bin, windows/app/src-tauri/resources/licenses | Out-Null
          # ffmpeg (gyan.dev essentials build: libx264, libass)
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($ff.FullName)/bin/ffmpeg.exe", "$($ff.FullName)/bin/ffprobe.exe" $bin
          Copy-Item "$($ff.FullName)/LICENSE" windows/app/src-tauri/resources/licenses/FFmpeg-LICENSE.txt
          # whisper.cpp v1.9.4 (CPU build, published on build tag b5130)
          gh release download b5130 --repo ggml-org/whisper.cpp --pattern whisper-bin-x64.zip --output whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper
          Get-ChildItem whisper -Recurse -Include whisper-cli.exe, *.dll | Copy-Item -Destination $bin
          Copy-Item vendor/licenses/whisper.cpp-MIT.txt windows/app/src-tauri/resources/licenses/
          Get-ChildItem $bin | Format-Table Name, Length

      - name: Core tests
        working-directory: windows
        run: cargo test -p easycut-core

      - name: Build installer
        working-directory: windows/app
        run: |
          npm ci
          npx tauri build

      - name: Self-test on Windows
        run: |
          $env:PATH = "$PWD\windows\app\src-tauri\resources\bin;$env:PATH"
          # 창 앱(GUI subsystem)이라 끝날 때까지 기다려 종료 코드를 확인한다
          $p = Start-Process windows/target/release/easycut-windows.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest" -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path selftest.txt -Pattern "ALL PASSED" -Quiet)) { exit 1 }

      - name: MCP bridge on Windows (EasyCut.exe --mcp → running app)
        run: |
          $exe = Resolve-Path windows/target/release/easycut-windows.exe
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 12
          $lines = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"add_text","arguments":{"text":"CI","start":0}}}',
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"get_project_state","arguments":{}}}'
          )
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\mcp-in.txt", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $p = Start-Process $exe -ArgumentList "--mcp" -Wait -PassThru -NoNewWindow -RedirectStandardInput "$env:RUNNER_TEMP\mcp-in.txt" -RedirectStandardOutput "$env:RUNNER_TEMP\mcp-out.txt"
          $out = Get-Content "$env:RUNNER_TEMP\mcp-out.txt" -Encoding UTF8
          $out | ForEach-Object { $_.Substring(0, [Math]::Min(200, $_.Length)) }
          Stop-Process -Id $app.Id -Force
          $tools = ($out[1] | ConvertFrom-Json).result.tools.Count
          if ($tools -ne 24) { Write-Error "expected 24 tools, got $tools"; exit 1 }
          if (-not ($out[3] -match '"isError":false') -or -not ($out[3] -match 'CI')) { Write-Error "tool call through the running app failed"; exit 1 }

      - name: Silent install (what auto-update runs) and self-test of the installed app
        run: |
          $setup = Get-ChildItem windows/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit code $($p.ExitCode)"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA "EasyCut"
          Get-ChildItem $dir -Recurse -Depth 2 | Select-Object FullName, Length | Format-Table -AutoSize
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          if (-not $exe) { Write-Error "installed app not found in $dir"; exit 1 }
          $t = Start-Process $exe.FullName -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest2" -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest2.txt
          Get-Content selftest2.txt | Select-Object -First 6
          if ($t.ExitCode -ne 0 -or -not (Select-String -Path selftest2.txt -Pattern "ALL PASSED" -Quiet)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: EasyCut-Windows-setup
          path: windows/target/release/bundle/nsis/*.exe

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem windows/target/release/bundle/nsis/*.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $exe.FullName --prerelease --title "EasyCut for Windows $($env:GITHUB_REF_NAME.Substring(5))" --notes-file windows/RELEASE_NOTES.txt
