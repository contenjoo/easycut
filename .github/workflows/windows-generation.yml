name: Windows VM audio endpoint preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-devices:
    runs-on: windows-2025-vs2026
    timeout-minutes: 4
    steps:
      - name: Check the stock Windows VM audio input and output
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version | Format-List
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table Name,Status,StartType
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table Name,Status,StartType
          Get-CimInstance Win32_SoundDevice | Select-Object Name,Status,PNPDeviceID | Format-List
          $devices = @(Get-PnpDevice -Class AudioEndpoint -PresentOnly -ErrorAction SilentlyContinue)
          $devices | Select-Object Status,FriendlyName,InstanceId | Format-Table -AutoSize
          Add-Type @'
          using System.Runtime.InteropServices;
          public static class WaveEndpoints {
            [DllImport("winmm.dll")] public static extern uint waveOutGetNumDevs();
            [DllImport("winmm.dll")] public static extern uint waveInGetNumDevs();
          }
          '@
          @{ waveOut=[WaveEndpoints]::waveOutGetNumDevs(); waveIn=[WaveEndpoints]::waveInGetNumDevs(); pnp=$devices.Count } | ConvertTo-Json -Compress
