name: OK Cut 0.10.0 Windows VM clean loopback A/B and distinct audio QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording:
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download and install the public 0.10.0 release
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'OKCut_0.10.0_x64-setup.exe'
          $evidence = Join-Path $env:RUNNER_TEMP 'okcut-vm-evidence'
          $installed = Join-Path $env:LOCALAPPDATA 'EasyCut/easycut-windows.exe'
          if (Test-Path $installed) { throw 'An existing installation was found on the supposedly fresh VM' }
          New-Item -Type Directory $evidence | Out-Null
          curl.exe -fLsS --retry 2 https://github.com/contenjoo/easycut/releases/download/win-v0.10.0/OKCut_0.10.0_x64-setup.exe -o $installer
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $LASTEXITCODE" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '506c639f9045121f2a370b7b9233b8848320c8e5da86a011849e14b62d3af4ab') { throw 'Unexpected release installer SHA256' }
          $result = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installation failed: $($result.ExitCode)" }
          if (!(Test-Path $installed)) { throw 'Installed app is missing' }
          $reg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\EasyCut'
          if ($reg.DisplayName -ne 'OK Cut' -or $reg.DisplayVersion -ne '0.10.0') { throw 'Unexpected installed version' }
          @{
            name=$reg.DisplayName; version=$reg.DisplayVersion; installerSha256=$hash;
            installerBytes=(Get-Item $installer).Length; os=(Get-CimInstance Win32_OperatingSystem).Caption;
            architecture=$env:PROCESSOR_ARCHITECTURE; runId=$env:GITHUB_RUN_ID; fresh=$true
          } | ConvertTo-Json | Set-Content "$evidence/installation.json"
          "OKCUT_EXE=$installed" >> $env:GITHUB_ENV
          "OKCUT_EVIDENCE=$evidence" >> $env:GITHUB_ENV
      - name: Prepare signed audio fixture endpoints on the disposable VM
        shell: pwsh
        run: .\windows\app\tests\okcut-vm-native-audio.ps1
      - name: Measure loopback before and after, then record independent mic and system signals
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/okcut-vm-tools" --no-save playwright-core
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install test driver' }
          $env:NODE_PATH = "$env:RUNNER_TEMP/okcut-vm-tools/node_modules"
          $nativeProbe = Join-Path $env:RUNNER_TEMP 'OkCutLoopbackProbe'
          dotnet new console --framework net8.0 --no-restore --output $nativeProbe
          if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare native loopback probe' }
          Copy-Item windows/app/tests/OkCutVmLoopbackCheck.cs (Join-Path $nativeProbe 'Program.cs') -Force
          $project = Join-Path $nativeProbe 'OkCutLoopbackProbe.csproj'
          dotnet add $project package NAudio --version 2.2.1
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore NAudio' }
          dotnet build $project --configuration Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Unable to build native loopback probe' }
          $env:OKCUT_LOOPBACK_PROBE = Join-Path $nativeProbe 'bin/Release/net8.0/OkCutLoopbackProbe.dll' 
          # Elevated WebView2 hosts ignore environment overrides on this runner.
          # Use the installed executable's own policy for loopback test control.
          $name = [IO.Path]::GetFileName($env:OKCUT_EXE)
          $settings = @{
            AdditionalBrowserArguments = "--remote-debugging-port=9222 --use-fake-device-for-media-stream --use-file-for-fake-audio-capture=$env:RUNNER_TEMP/okcut-mic-fixture.wav"
            UserDataFolder = "$env:RUNNER_TEMP/okcut-vm-webview"
          }
          $original = @{}
          $result = 1
          try {
            foreach ($setting in $settings.GetEnumerator()) {
              $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\$($setting.Key)"
              $original[$key] = Get-ItemPropertyValue -Path $key -Name $name -ErrorAction SilentlyContinue
              New-Item -Path $key -Force | Out-Null
              New-ItemProperty -Path $key -Name $name -Value $setting.Value -PropertyType String -Force | Out-Null
            }
            node windows/app/tests/okcut-vm-010.cjs
            $result = $LASTEXITCODE
          } finally {
            foreach ($key in $original.Keys) {
              if ($null -eq $original[$key]) { Remove-ItemProperty -Path $key -Name $name -ErrorAction SilentlyContinue }
              else { Set-ItemProperty -Path $key -Name $name -Value $original[$key] }
            }
          }
          exit $result
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okcut-0.10.0-distinct-audio-evidence
          path: ${{ runner.temp }}/okcut-vm-evidence
          if-no-files-found: error
          retention-days: 14
