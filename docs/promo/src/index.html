<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>EasyCut Promo</title>
<style>
:root{--c1:#F2566B;--c2:#8B3FEA;--c3:#3B6CF6;--bg:#07070D;--panel:#16161E;--panel2:#20202A;--line:rgba(255,255,255,.09);
  --text:#F5F5FA;--mute:#A6A6B8;--blue:#4C8DFF;--red:#FF4D5E;--green:#34D399;--yellow:#FFD60A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
body.en{font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif}
.mono{font-family:"SF Mono",Menlo,monospace}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#bg,#grid,#vig,#flash,#fade{position:absolute;inset:0;pointer-events:none}
.blob{position:absolute;width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%}
#grid{background-image:radial-gradient(rgba(255,255,255,.55) 1.2px,transparent 1.3px);background-size:44px 44px;opacity:.07;
  -webkit-mask-image:radial-gradient(ellipse 70% 65% at 50% 50%,#000 30%,transparent 100%)}
#vig{background:radial-gradient(ellipse 80% 75% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#flash{background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.9),rgba(190,150,255,.35) 35%,transparent 70%);opacity:0}
#fade{background:#000;opacity:0}
.scene{position:absolute;inset:0;display:none;transform-origin:50% 50%}
.abs{position:absolute}
.grad{background:linear-gradient(100deg,#FF6B81,#A259FF 50%,#4F83FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.line{display:block;overflow:hidden;padding:.02em 0 .1em}
.line>span{display:inline-block;will-change:transform}
.chip{display:inline-flex;align-items:center;gap:14px;padding:8px 24px 8px 9px;border-radius:999px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);font-size:27px;font-weight:500;color:#ECECF4;white-space:nowrap}
.chip b{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));
  font-size:18px;font-weight:700;color:#fff}
.h1{font-size:90px;font-weight:900;line-height:1.12;letter-spacing:-2.5px}
body.en .h1{font-weight:800;letter-spacing:-2.5px}
.p{font-size:31px;line-height:1.6;color:var(--mute);white-space:pre-line}
.win{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;
  box-shadow:0 50px 140px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.tbar{height:60px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025);font-size:24px;font-weight:700}
.tbar i{width:14px;height:14px;border-radius:50%;display:block}
.tbar .ttl{margin-left:14px}
.tbar .st{margin-left:auto;font-size:21px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;font-size:24px;font-weight:500;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#E6E6EF;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;border-radius:14px;font-size:26px;font-weight:700;color:#fff;white-space:nowrap}
.ico{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* S1 */
#s1 .clip{position:absolute;height:34px;border-radius:9px}
#s1 .h{position:absolute;left:0;right:0;top:370px;text-align:center;font-size:124px;font-weight:900;letter-spacing:-4px;line-height:1.15}
body.en #s1 .h{font-weight:800}
/* S2 */
#s2 .wrap{position:absolute;left:0;right:0;top:120px;display:flex;flex-direction:column;align-items:center}
#s2 .iconbox{position:relative;width:420px;height:420px}
#s2 .iconbox img{width:420px;height:420px;position:relative}
#s2 .glow{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;
  background:radial-gradient(circle,rgba(162,89,255,.55),rgba(79,131,255,.18) 40%,transparent 68%)}
#s2 .word{font-family:system-ui,-apple-system,sans-serif;font-size:170px;font-weight:800;letter-spacing:-5px;line-height:1;margin-top:10px}
#s2 .word span{display:inline-block}
#s2 .tag{font-size:44px;font-weight:500;color:#D9D9E6;margin-top:38px;letter-spacing:-.5px}
/* S3 */
#s3 .left{left:130px;top:285px;width:700px}
#s3 .card{left:880px;top:200px;width:910px;height:660px}
#s3 .tx-area{position:absolute;left:0;right:0;top:60px;padding:28px 40px}
#s3 .tl{display:flex;align-items:baseline;gap:22px;font-size:32px;line-height:1.4;padding:13px 0}
#s3 .wrap2{overflow:hidden}
#s3 .ts{width:74px;flex:none;font-size:25px;color:var(--blue)}
#s3 em{font-style:normal;color:#FF9F43}
#s3 .selw{position:relative;display:inline-block}
#s3 .selbg{position:absolute;left:-6px;top:0;bottom:0;border-radius:8px;background:rgba(76,141,255,.45);width:0}
#s3 .seltxt{position:relative}
#s3 .strike{position:absolute;left:-4px;top:54%;height:4px;border-radius:2px;background:var(--red);width:0}
#s3 .key{position:absolute;width:104px;height:104px;border-radius:22px;background:linear-gradient(#3A3A46,#26262F);
  border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 0 #111118,0 24px 50px rgba(0,0,0,.6);display:grid;place-items:center;font-size:52px;color:#fff}
#s3 .tlbox{position:absolute;left:0;right:0;bottom:0;height:250px;border-top:1px solid var(--line);padding:24px 40px;background:rgba(0,0,0,.18)}
#s3 .tlhead{display:flex;justify-content:space-between;align-items:center;font-size:23px;color:var(--mute);margin-bottom:16px}
#s3 .dur b{color:#fff;font-weight:700}
#s3 .toastw{left:880px;width:910px;top:892px;text-align:center}
#s3 .badges{display:flex;gap:14px;margin-top:40px}
/* S4 */
#s4 .head{left:0;right:0;top:120px;text-align:center}
#s4 .panel{left:160px;top:470px;width:1600px;height:470px}
#s4 canvas{position:absolute;left:30px;top:84px}
#s4 .phead{position:absolute;left:36px;right:36px;top:24px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:var(--mute)}
#s4 .prow{position:absolute;left:36px;right:36px;bottom:26px;display:flex;align-items:center;gap:22px}
#s4 .count{font-size:30px;font-weight:700;color:#FF6B7A}
#s4 .time{font-size:28px;color:#DADAE6}
#s4 .save{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.4);color:#6EF0B8;font-weight:700}
#s4 .cutbtn{margin-left:auto;background:linear-gradient(180deg,#FF5A6A,#E23A4C);box-shadow:0 10px 30px rgba(255,77,94,.35)}
/* S5 */
#s5 .frame{left:130px;top:215px;width:1040px;height:585px;border-radius:26px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 50px 140px rgba(0,0,0,.6)}
#s5 .fbg{position:absolute;inset:-10%;background:linear-gradient(120deg,#FF8FC4 0%,#FF8FC4 38%,#7A5CFF 52%,#2FA7FF 62%,#1E3A8A 100%)}
#s5 .cap{position:absolute;left:0;right:0;bottom:52px;text-align:center}
#s5 .cap span{display:inline-block;font-size:44px;font-weight:700;padding:8px 22px;border-radius:10px;white-space:nowrap}
#s5 .cap.basic span{background:rgba(0,0,0,.75);color:#fff}
#s5 .cap.yellow span{color:var(--yellow);font-weight:900;
  text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,2px 2px #000,-2px -2px #000,2px -2px #000,-2px 2px #000,0 6px 14px rgba(0,0,0,.5)}
#s5 .cap.outline span{color:#fff;font-weight:900;font-size:50px;
  text-shadow:4px 0 #111,-4px 0 #111,0 4px #111,0 -4px #111,3px 3px #111,-3px -3px #111,3px -3px #111,-3px 3px #111,0 8px 20px rgba(0,0,0,.55)}
#s5 .right{left:1250px;top:180px;width:600px}
body.en #s5 .h1{font-size:70px !important}
#s5 .styles{display:flex;gap:12px;margin-top:34px}
#s5 .sty{padding:12px 24px;border-radius:12px;font-size:25px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
#s5 .sty.on{background:linear-gradient(135deg,var(--c2),var(--c3));border-color:transparent}
#s5 .list{margin-top:26px;border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
#s5 .row{display:flex;gap:18px;align-items:center;padding:14px 20px;font-size:23px;border-bottom:1px solid var(--line);color:#CFCFDC;white-space:nowrap;overflow:hidden}
#s5 .row:last-child{border-bottom:0}
#s5 .row .mono{font-size:19px;color:var(--mute)}
#s5 .row.on{background:rgba(76,141,255,.18);color:#fff}
#s5 .srt{display:flex;gap:12px;margin-top:22px}
/* S6 */
#s6 .left{left:130px;top:250px;width:700px}
#s6 .card{left:880px;top:140px;width:910px;height:800px}
#s6 .logos{display:flex;gap:14px;margin-top:40px}
#s6 .ubub{position:absolute;right:36px;top:100px;max-width:640px;padding:20px 28px;border-radius:26px 26px 8px 26px;
  background:linear-gradient(135deg,#8B3FEA,#3B6CF6);font-size:28px;line-height:1.45;font-weight:500}
#s6 .think{position:absolute;left:36px;top:250px;padding:22px 28px;border-radius:26px 26px 26px 8px;background:var(--panel2);display:flex;gap:10px;align-items:center;font-size:24px;color:var(--mute)}
#s6 .think i{display:block;width:12px;height:12px;border-radius:50%;background:#B9B9CC}
#s6 .abub{position:absolute;left:36px;top:250px;width:780px;padding:26px 30px;border-radius:26px 26px 26px 8px;background:var(--panel2)}
#s6 .step{display:flex;align-items:center;gap:18px;font-size:27px;padding:10px 0}
#s6 .step .ck{width:40px;height:40px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
#s6 .step .ck svg{width:24px;height:24px;fill:none;stroke:#062;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
#s6 .step .dim{margin-left:auto;color:#6EF0B8;font-weight:700;font-size:25px}
#s6 .done{font-size:26px;color:#D5D5E2;margin-top:16px;padding-top:18px;border-top:1px solid var(--line)}
#s6 .input{position:absolute;left:30px;right:30px;bottom:30px;height:82px;border-radius:20px;background:#0E0E14;border:1px solid rgba(255,255,255,.14);
  display:flex;align-items:center;padding:0 16px 0 28px;font-size:28px}
#s6 .input .ph{color:#6B6B7D}
#s6 .caret{display:inline-block;width:3px;height:34px;background:#fff;margin-left:2px;vertical-align:middle}
#s6 .send{margin-left:auto;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c2),var(--c3))}
#s6 .undo{position:absolute;left:0;right:0;bottom:130px;text-align:center;font-size:21px;color:#7C7C90}
/* S7 */
#s7 .head{left:0;right:0;top:120px;text-align:center}
#s7 .tile{position:absolute;width:390px;height:250px;border-radius:26px;background:var(--panel);border:1px solid var(--line);padding:34px 32px;
  box-shadow:0 30px 80px rgba(0,0,0,.45)}
#s7 .tile .ib{width:68px;height:68px;border-radius:18px;display:grid;place-items:center}
#s7 .tile h3{font-size:31px;font-weight:700;margin-top:26px;letter-spacing:-.5px}
#s7 .tile p{font-size:22px;color:var(--mute);margin-top:8px;line-height:1.45}
/* S8 */
#s8 .head{left:0;right:0;top:64px;text-align:center}
#s8 .persp{position:absolute;left:0;right:0;top:230px;height:840px;perspective:2200px}
#s8 .shot{position:absolute;left:330px;top:0;width:1260px;height:788px;border-radius:18px;overflow:hidden;
  box-shadow:0 60px 160px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.1);transform-origin:50% 0%}
#s8 .shot img{position:absolute;inset:0;width:100%;height:100%}
#s8 .sglow{position:absolute;left:260px;right:260px;top:120px;height:700px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(139,63,234,.55),rgba(59,108,246,.2) 45%,transparent 70%)}
#s8 .lbl{position:absolute;left:0;right:0;top:188px;text-align:center;font-size:24px;color:var(--mute)}
/* S9 */
#s9 .wrap{position:absolute;left:0;right:0;top:92px;display:flex;flex-direction:column;align-items:center}
#s9 .iconbox{position:relative;width:300px;height:300px}
#s9 .iconbox img{width:300px;height:300px;position:relative}
#s9 .glow{position:absolute;left:50%;top:50%;width:800px;height:800px;margin:-400px 0 0 -400px;border-radius:50%;
  background:radial-gradient(circle,rgba(162,89,255,.5),rgba(79,131,255,.15) 40%,transparent 68%)}
#s9 .word{font-family:system-ui,-apple-system,sans-serif;font-size:136px;font-weight:800;letter-spacing:-4px;line-height:1;margin-top:6px}
#s9 .word span{display:inline-block}
#s9 .tag{font-size:38px;color:#D9D9E6;margin-top:30px}
#s9 .badges{display:flex;gap:16px;margin-top:40px}
#s9 .cta{position:relative;overflow:hidden;margin-top:44px;display:flex;align-items:center;gap:18px;padding:22px 40px;border-radius:999px;
  background:linear-gradient(100deg,#F2566B,#8B3FEA 50%,#3B6CF6);font-size:36px;font-weight:700;box-shadow:0 20px 60px rgba(139,63,234,.45)}
#s9 .cta .shine{position:absolute;top:0;bottom:0;width:160px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent)}
</style></head>
